name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just setup
      - run: just check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just setup
      # Small sources are fetched so the reproduction tests run in CI. The EAGLE-I
      # archive (11.6 GB) is not; its tests read the committed aggregates and skip
      # the full-table check.
      - run: just fetch-sources eia861 acs
      - run: just test

  ok:
    name: ok
    needs: [check, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          results="${{ join(needs.*.result, ',') }}"
          case "$results" in *failure*|*cancelled*) exit 1 ;; esac
          echo ok
