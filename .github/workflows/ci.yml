name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just setup
      - run: just check

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - run: just setup
      # Small sources are fetched so the reproduction tests run in CI. The EAGLE-I
      # archive (11.6 GB) is not; its tests read the committed aggregates and skip
      # the full-table check.
      - run: just fetch-sources eia861 acs
      - run: just test

  ok:
    name: ok
    needs: [check, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          results="${{ join(needs.*.result, ',') }}"
          case "$results" in *failure*|*cancelled*) exit 1 ;; esac
          echo ok
