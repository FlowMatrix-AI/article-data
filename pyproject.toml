[project]
name = "article-data"
version = "0.1.0"
description = "The data and code behind the articles on flowmatrixai.com"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "requests>=2.32",
    "trendspy>=0.1.6",
]

[project.scripts]
article-data = "article_data.cli:main"

[dependency-groups]
dev = [
    "pandas-stubs>=2.2",
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.6",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/article_data"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["article_data", "conftest", "reference"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "fetched: needs the fetched raw sources under outputs/raw (run `article-data fetch` first)",
]
